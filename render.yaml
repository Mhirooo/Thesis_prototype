services:
  - type: web
    name: hirely-app
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install --upgrade pip setuptools wheel
      pip install -r requirements.txt
      cd Hirely
      mkdir -p instance/uploads chroma_storage data
      python -c "from app import create_app, db; app = create_app(); app.app_context().push(); db.create_all()"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CHROMA_DISABLE_TELEMETRY
        value: "1"
      - key: PYTHON_VERSION
        value: "3.10.11"